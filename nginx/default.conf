server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/ld+json application/xml image/svg+xml image/x-icon;

    include /etc/nginx/snippets/security-headers.conf;

    # HTML: always revalidate so content updates show up immediately.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Asset filenames are not fingerprinted, so cache for a bounded time
    # rather than marking them immutable.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Never serve dotfiles (e.g. .git) even if they end up in the image.
    location ~ /\. {
        deny all;
        return 404;
    }
}
